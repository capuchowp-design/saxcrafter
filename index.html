<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saxcrafter</title>
<meta name="theme-color" content="#0d0a07">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0d0a07; --panel:#17110b; --panel2:#21170d; --line:#3a2a14;
    --gold:#d4a843; --amber:#f0b429; --brass:#9c7a2b; --text:#ecdcb8; --muted:#9a8660;
    --black-key:#120d08; --white-key:#1b140c; --c-row:#2a1e0f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 50% -10%,#2a1c0a 0%,var(--bg) 60%)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  header svg{width:34px;height:34px;flex:none}
  h1{font-size:20px;margin:0;letter-spacing:.5px;color:var(--gold);font-weight:700}
  h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:1.5px;text-transform:uppercase}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .group{display:flex;align-items:center;gap:6px}
  label{font-size:12px;color:var(--muted)}
  button,select,input[type=number]{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
  button:hover,select:hover{border-color:var(--brass)}
  button.primary{background:linear-gradient(180deg,var(--amber),var(--gold));color:#1a1204;border-color:var(--gold);font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  button.active{border-color:var(--amber);color:var(--amber)}
  input[type=number]{width:70px}
  input[type=range]{accent-color:var(--amber);width:110px}
  #status{margin-left:auto;font-size:12px;color:var(--muted)}
  #status.ok{color:var(--amber)}
  main{flex:1;min-height:0;display:flex;padding:12px 16px 16px}
  #wrap{position:relative;flex:1;min-width:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  #grid{position:relative}
  .row{display:flex;height:22px}
  .lab{position:sticky;left:0;z-index:3;width:54px;flex:none;font-size:11px;line-height:22px;padding-left:8px;
       color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid #00000040;cursor:pointer;user-select:none}
  .lab.white{background:#241a0e}
  .lab.black{background:#0e0a06;color:#6f5f40}
  .lab.c{color:var(--gold);font-weight:700}
  .cells{position:relative;flex:none;border-bottom:1px solid #00000040}
  .cells.white{background-color:var(--white-key)}
  .cells.black{background-color:var(--black-key)}
  .cells.c{box-shadow:inset 0 -1px 0 var(--c-row)}
  .note{position:absolute;top:2px;height:18px;border-radius:5px;z-index:2;
        background:linear-gradient(180deg,var(--amber),var(--brass));border:1px solid #ffe6a0;pointer-events:none;
        box-shadow:0 0 8px #f0b42955}
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);box-shadow:0 0 10px var(--amber);z-index:4;pointer-events:none;display:none}
  .help{font-size:12px;color:var(--muted);padding:8px 16px 14px}
  .help b{color:var(--gold)}
  #loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d0a07cc;z-index:20;color:var(--gold)}
  @media (max-width:600px){ input[type=range]{width:80px} }
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M40 6c3 0 5 2 5 5v22c0 10-6 18-14 21-5 2-9 1-11-2-2-4 0-8 4-10 4-2 6-5 6-9V11c0-3 2-5 5-5z" fill="none" stroke="#d4a843" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="50" r="7" fill="#f0b429"/>
    <circle cx="40" cy="14" r="2.5" fill="#f0b429"/><circle cx="40" cy="24" r="2.5" fill="#f0b429"/><circle cx="40" cy="34" r="2.5" fill="#f0b429"/>
  </svg>
  <h1>Saxcrafter<small>Editor de partituras com saxofone real</small></h1>
</header>

<div class="toolbar">
  <div class="group">
    <button id="play" class="primary">▶ Tocar</button>
    <button id="pause">⏸ Pausar</button>
    <button id="stop">⏹ Parar</button>
  </div>
  <div class="group"><label for="inst">Sax</label>
    <select id="inst">
      <option value="alto_sax">Alto</option>
      <option value="tenor_sax">Tenor</option>
      <option value="soprano_sax">Soprano</option>
      <option value="baritone_sax">Barítono</option>
    </select>
  </div>
  <div class="group"><label for="bpm">BPM</label><input id="bpm" type="number" min="30" max="240" value="100"></div>
  <div class="group"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  <div class="group"><label for="meas">Compassos</label><input id="meas" type="number" min="1" max="64" value="4"></div>
  <div class="group"><label for="len">Duração</label>
    <select id="len">
      <option value="1">Semicolcheia</option>
      <option value="2">Colcheia</option>
      <option value="4" selected>Semínima</option>
      <option value="8">Mínima</option>
      <option value="16">Semibreve</option>
    </select>
  </div>
  <div class="group">
    <button id="save">Salvar</button>
    <button id="load">Carregar</button>
    <button id="clear">Limpar</button>
  </div>
  <div class="group">
    <button id="exJson">JSON</button>
    <button id="imJson">Importar</button>
    <button id="exMidi">MIDI</button>
    <button id="exWav">WAV</button>
  </div>
  <div id="status">Carregando saxofone…</div>
</div>

<main><div id="wrap"><div id="grid"></div><div id="playhead"></div></div></main>
<div class="help"><b>Toque</b> numa célula para inserir uma nota (com a duração escolhida) e toque na nota para removê-la. Toque no nome da nota à esquerda para ouvi-la. Acordes: coloque várias notas no mesmo tempo.</div>
<div id="loading">Gerando arquivo…</div>
<input id="file" type="file" accept="application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
<script>
(() => {
  'use strict';
  const LOW = 48, HIGH = 84;          // C3 .. C6
  const CELL = 28;                    // largura de 1/16
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BLACK = new Set([1,3,6,8,10]);
  const PROGRAM = {soprano_sax:64, alto_sax:65, tenor_sax:66, baritone_sax:67};
  const $ = id => document.getElementById(id);
  const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);

  let notes = [];                     // {p, s, d}
  let ctx = null, inst = null, instName = 'alto_sax';
  let playing = false, startedAt = 0, startStep = 0, posStep = 0, raf = 0, endTimer = 0;

  const steps = () => Math.max(1, Math.min(64, +$('meas').value || 4)) * 16;
  const stepSec = () => 60 / (Math.max(30, Math.min(240, +$('bpm').value || 100))) / 4;

  function setStatus(t, ok){ const s = $('status'); s.textContent = t; s.className = ok ? 'ok' : ''; }

  /* ---------- áudio ---------- */
  function ensureCtx(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function loadInstrument(){
    if(typeof Soundfont === 'undefined'){ setStatus('Sem conexão com as amostras'); return Promise.resolve(); }
    ensureCtx();
    instName = $('inst').value;
    setStatus('Carregando ' + $('inst').selectedOptions[0].text + '…');
    inst = null;
    return Soundfont.instrument(ctx, instName, {soundfont:'MusyngKite', gain: 2, destination: master()})
      .then(i => { inst = i; setStatus('Saxofone pronto', true); })
      .catch(() => setStatus('Falha ao carregar amostras (verifique a internet)'));
  }
  let masterGain = null;
  function master(){
    if(!masterGain){ masterGain = ctx.createGain(); masterGain.connect(ctx.destination); }
    masterGain.gain.value = +$('vol').value;
    return masterGain;
  }

  function previewNote(m){
    ensureCtx();
    if(!inst){ return; }
    inst.play(noteName(m), ctx.currentTime, {duration: 0.7});
  }

  function play(){
    ensureCtx();
    if(!inst){ setStatus('Aguarde o saxofone carregar…'); return; }
    stopSound();
    const total = steps();
    if(posStep >= total) posStep = 0;
    startStep = posStep;
    const t0 = ctx.currentTime + 0.08;
    startedAt = t0;
    const ss = stepSec();
    notes.forEach(n => {
      if(n.s + n.d <= startStep || n.s >= total) return;
      const from = Math.max(n.s, startStep);
      const when = t0 + (from - startStep) * ss;
      const dur = Math.max(0.08, (Math.min(n.s + n.d, total) - from) * ss);
      inst.play(noteName(n.p), when, {duration: dur, gain: 1});
    });
    playing = true;
    $('playhead').style.display = 'block';
    $('play').classList.add('active');
    clearTimeout(endTimer);
    endTimer = setTimeout(() => { if(playing){ stop(); } }, ((total - startStep) * ss + 0.6) * 1000);
    cancelAnimationFrame(raf); tick();
  }
  function tick(){
    if(!playing) return;
    const s = startStep + Math.max(0, ctx.currentTime - startedAt) / stepSec();
    posStep = Math.min(s, steps());
    movePlayhead(posStep);
    raf = requestAnimationFrame(tick);
  }
  function movePlayhead(s){
    const x = 54 + s * CELL;
    const ph = $('playhead'); ph.style.left = x + 'px';
    const w = $('wrap');
    if(x < w.scrollLeft + 70 || x > w.scrollLeft + w.clientWidth - 40) w.scrollLeft = Math.max(0, x - 120);
  }
  function stopSound(){
    if(inst) try{ inst.stop(); }catch(e){}
    clearTimeout(endTimer);
    cancelAnimationFrame(raf);
    playing = false;
    $('play').classList.remove('active');
  }
  function pause(){ if(!playing) return; stopSound(); }
  function stop(){ stopSound(); posStep = 0; $('playhead').style.display = 'none'; $('wrap').scrollLeft = 0; }

  /* ---------- grade ---------- */
  function build(){
    const g = $('grid'); g.innerHTML = '';
    const total = steps(), width = total * CELL;
    g.style.width = (54 + width) + 'px';
    for(let m = HIGH; m >= LOW; m--){
      const kind = BLACK.has(m % 12) ? 'black' : 'white';
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('div');
      lab.className = 'lab ' + kind + (m % 12 === 0 ? ' c' : '');
      lab.textContent = noteName(m);
      lab.addEventListener('click', () => previewNote(m));
      const cells = document.createElement('div');
      cells.className = 'cells ' + kind + (m % 12 === 0 ? ' c' : '');
      cells.dataset.p = m;
      cells.style.width = width + 'px';
      // linhas verticais: semicolcheia fraca, tempo média, compasso forte
      cells.style.backgroundImage =
        `linear-gradient(90deg,#d4a84355 1px,transparent 1px),` +
        `linear-gradient(90deg,#d4a84322 1px,transparent 1px),` +
        `linear-gradient(90deg,#d4a84311 1px,transparent 1px)`;
      cells.style.backgroundSize = `${CELL*16}px 100%,${CELL*4}px 100%,${CELL}px 100%`;
      cells.addEventListener('click', e => onCell(e, m, cells));
      row.append(lab, cells); g.append(row);
    }
    renderNotes();
  }
  function renderNotes(){
    document.querySelectorAll('.note').forEach(n => n.remove());
    const total = steps();
    notes = notes.filter(n => n.s < total && n.p >= LOW && n.p <= HIGH);
    notes.forEach(n => {
      const cells = document.querySelector(`.cells[data-p="${n.p}"]`);
      if(!cells) return;
      const el = document.createElement('div'); el.className = 'note';
      el.style.left = (n.s * CELL + 1) + 'px';
      el.style.width = (Math.min(n.d, total - n.s) * CELL - 2) + 'px';
      cells.append(el);
    });
  }
  function onCell(e, p, cells){
    const x = e.clientX - cells.getBoundingClientRect().left;
    const s = Math.floor(x / CELL);
    const hit = notes.findIndex(n => n.p === p && s >= n.s && s < n.s + n.d);
    if(hit >= 0){ notes.splice(hit, 1); }
    else {
      const d = Math.min(+$('len').value, steps() - s);
      notes.push({p, s, d});
      previewNote(p);
    }
    renderNotes();
  }

  /* ---------- salvar / carregar ---------- */
  const KEY = 'saxcrafter:project';
  const snapshot = () => ({v:1, bpm:+$('bpm').value, measures:+$('meas').value, inst:$('inst').value, vol:+$('vol').value, notes});
  function apply(d){
    if(!d || !Array.isArray(d.notes)) throw new Error('arquivo inválido');
    $('bpm').value = d.bpm || 100; $('meas').value = d.measures || 4; $('vol').value = d.vol ?? 0.8;
    notes = d.notes.filter(n => Number.isFinite(n.p) && Number.isFinite(n.s) && Number.isFinite(n.d));
    if(d.inst && d.inst !== $('inst').value){ $('inst').value = d.inst; loadInstrument(); }
    if(masterGain) masterGain.gain.value = +$('vol').value;
    stop(); build();
  }
  function download(name, blob){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ---------- exportar MIDI ---------- */
  function vlq(n){ const b = [n & 0x7f]; while((n >>= 7)) b.unshift((n & 0x7f) | 0x80); return b; }
  function midiBlob(){
    const TPS = 120; // ticks por semicolcheia (480 por semínima)
    const ev = [];
    notes.forEach(n => { ev.push([n.s * TPS, 1, n.p]); ev.push([(n.s + n.d) * TPS, 0, n.p]); });
    ev.sort((a,b) => a[0] - b[0] || a[1] - b[1]);
    const mpq = Math.round(60000000 / (+$('bpm').value || 100));
    const tr = [0,0xff,0x51,3,(mpq>>16)&255,(mpq>>8)&255,mpq&255, 0,0xc0,PROGRAM[$('inst').value]];
    let last = 0;
    ev.forEach(([t, on, p]) => { tr.push(...vlq(t - last), on ? 0x90 : 0x80, p, on ? 90 : 0); last = t; });
    tr.push(0,0xff,0x2f,0);
    const head = [0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0x01,0xe0];
    const len = tr.length;
    const trk = [0x4d,0x54,0x72,0x6b,(len>>24)&255,(len>>16)&255,(len>>8)&255,len&255, ...tr];
    return new Blob([new Uint8Array([...head, ...trk])], {type:'audio/midi'});
  }

  /* ---------- exportar WAV ---------- */
  function wavBlob(buf){
    const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
    const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0,'RIFF'); out.setUint32(4, 36 + n*ch*2, true); w(8,'WAVE'); w(12,'fmt ');
    out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,ch,true);
    out.setUint32(24,sr,true); out.setUint32(28,sr*ch*2,true); out.setUint16(32,ch*2,true); out.setUint16(34,16,true);
    w(36,'data'); out.setUint32(40, n*ch*2, true);
    const data = []; for(let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
    let o = 44;
    for(let i = 0; i < n; i++) for(let c = 0; c < ch; c++){
      const v = Math.max(-1, Math.min(1, data[c][i]));
      out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2;
    }
    return new Blob([out], {type:'audio/wav'});
  }
  async function exportWav(){
    if(!notes.length){ setStatus('Adicione notas antes de exportar'); return; }
    $('loading').style.display = 'flex';
    try{
      const sr = 44100, ss = stepSec();
      const end = Math.max(...notes.map(n => n.s + n.d)) * ss + 1.5;
      const off = new OfflineAudioContext(2, Math.ceil(end * sr), sr);
      const g = off.createGain(); g.gain.value = +$('vol').value; g.connect(off.destination);
      const i = await Soundfont.instrument(off, $('inst').value, {soundfont:'MusyngKite', gain:2, destination:g});
      notes.forEach(n => i.play(noteName(n.p), n.s * ss, {duration: n.d * ss, gain: 1}));
      const rendered = await off.startRendering();
      download('saxcrafter.wav', wavBlob(rendered));
    }catch(e){ setStatus('Não foi possível gerar o WAV'); }
    $('loading').style.display = 'none';
  }

  /* ---------- eventos ---------- */
  $('play').onclick = play;
  $('pause').onclick = pause;
  $('stop').onclick = stop;
  $('inst').onchange = () => { stopSound(); loadInstrument(); };
  $('vol').oninput = () => { if(masterGain) masterGain.gain.value = +$('vol').value; };
  $('bpm').onchange = () => { if(playing){ const p = posStep; stopSound(); posStep = p; play(); } };
  $('meas').onchange = () => { stop(); build(); };
  $('save').onclick = () => { localStorage.setItem(KEY, JSON.stringify(snapshot())); setStatus('Projeto salvo', true); };
  $('load').onclick = () => {
    const raw = localStorage.getItem(KEY);
    if(!raw){ setStatus('Nada salvo ainda'); return; }
    try{ apply(JSON.parse(raw)); setStatus('Projeto carregado', true); }catch(e){ setStatus('Projeto salvo está corrompido'); }
  };
  $('clear').onclick = () => { if(!notes.length || confirm('Apagar todas as notas?')){ notes = []; renderNotes(); } };
  $('exJson').onclick = () => download('saxcrafter.json', new Blob([JSON.stringify(snapshot(), null, 2)], {type:'application/json'}));
  $('imJson').onclick = () => $('file').click();
  $('file').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ apply(JSON.parse(await f.text())); setStatus('Arquivo importado', true); }catch(err){ setStatus('Arquivo inválido'); }
    e.target.value = '';
  };
  $('exMidi').onclick = () => notes.length ? download('saxcrafter.mid', midiBlob()) : setStatus('Adicione notas antes de exportar');
  $('exWav').onclick = exportWav;
  document.addEventListener('keydown', e => {
    if(e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){
      e.preventDefault(); playing ? pause() : play();
    }
  });
  // navegadores só liberam áudio após um gesto do usuário
  const first = () => { ensureCtx(); if(!inst) loadInstrument(); document.removeEventListener('pointerdown', first); };
  document.addEventListener('pointerdown', first);

  build();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
